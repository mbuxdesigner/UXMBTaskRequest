<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi Ảnh đa năng v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .container { max-width: 900px; margin-left: auto; margin-right: auto; }
        button:hover:not(:disabled) { opacity: 0.9; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .image-item { border: 1px solid #e2e8f0; border-radius: 0.375rem; overflow: hidden; text-align: center; padding-bottom: 0.5rem; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.2s ease-in-out; background-color: #fff; }
        .image-item:hover { transform: scale(1.02); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .image-item img { max-width: 100%; height: 120px; object-fit: contain; display: block; margin-bottom: 0.5rem; flex-shrink: 0; pointer-events: none; background-color: #f8fafc; }
        .image-item .info { padding: 0 0.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .image-item p { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; margin-bottom: 0.1rem; }
        .image-item .file-size { font-size: 0.7rem; color: #64748b; margin-bottom: 0.25rem; }
        .image-item .size-diff { font-size: 0.7rem; font-weight: bold; }
        .text-green-600 { color: #16a34a; }
        .text-red-600 { color: #dc2626; }
        .image-item a { margin-top: 0.5rem; align-self: center; pointer-events: auto; }
        .error-message { color: #dc2626; margin-top: 0.5rem; font-size: 0.875rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-buttons { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        #dropZone { border: 2px dashed #cbd5e1; border-radius: 0.5rem; padding: 2rem; text-align: center; cursor: pointer; transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out; }
        #dropZone.dragover { background-color: #eff6ff; border-color: #3b82f6; }
        
        /* Modal Styles */
        .image-modal { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 50; opacity: 0; visibility: hidden; transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out; }
        .image-modal.active { opacity: 1; visibility: visible; }
        .modal-content { background-color: white; padding: 1rem; border-radius: 0.5rem; max-width: 90vw; max-height: 90vh; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .modal-image-container { flex-grow: 1; overflow: auto; text-align: center; margin-bottom: 0.5rem; overscroll-behavior: contain; }
        .modal-image { display: block; max-width: 100%; max-height: 75vh; margin: auto; cursor: grab; transition: transform 0.2s ease-out; transform-origin: center center; }
        .modal-image.grabbing { cursor: grabbing; }
        .modal-controls { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 0.5rem; flex-shrink: 0; }
        .modal-close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background-color: rgba(0, 0, 0, 0.3); color: white; border: none; border-radius: 9999px; width: 2rem; height: 2rem; font-size: 1.25rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-close-btn:hover { background-color: rgba(0, 0, 0, 0.5); }
        .zoom-btn { background-color: #e5e7eb; border: 1px solid #d1d5db; border-radius: 0.375rem; padding: 0.25rem 0.5rem; font-size: 1rem; cursor: pointer; }
        .zoom-btn:hover { background-color: #d1d5db; }
        .zoom-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

    <div class="container bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Công cụ chuyển đổi Ảnh đa năng v2.1</h1>
        
        <!-- Input Area -->
        <div class="mb-6"> 
            <label for="fileInput" class="block mb-2 text-sm font-medium text-gray-700">Chọn hoặc kéo thả ảnh (PNG, JPG, JPEG):</label> 
            <div id="dropZone"> 
                <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/jpg" class="hidden"> 
                <p class="text-gray-500">Nhấp vào đây để chọn tệp hoặc kéo thả tệp ảnh vào khu vực này.</p> 
                <p class="mt-1 text-xs text-gray-500">Hỗ trợ định dạng: PNG, JPG, JPEG.</p> 
            </div> 
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <!-- Output Format Selection -->
            <div>
                <label for="outputFormat" class="block mb-2 text-sm font-medium text-gray-700">Định dạng đầu ra:</label>
                <select id="outputFormat" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    <option value="image/webp" selected>WebP (Khuyên dùng)</option>
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPEG/JPG</option>
                </select>
            </div>

            <!-- Quality Slider -->
            <div>
                <label for="qualitySlider" class="block mb-2 text-sm font-medium text-gray-700">Chất lượng ảnh (<span id="qualityValue">90</span>%):</label> 
                <input type="range" id="qualitySlider" min="1" max="100" value="90" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"> 
                <p class="text-xs text-gray-500 mt-1">Lưu ý: Chất lượng chỉ áp dụng cho WebP và JPEG.</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="text-center mb-6 action-buttons"> 
            <button id="convertButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out flex items-center gap-2" disabled> 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/> <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z"/> </svg>
                Chuyển đổi
            </button> 
            <button id="downloadZipButton" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 ease-in-out flex items-center gap-2" disabled> 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"> <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/> <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/> </svg>
                Tải xuống tất cả (ZIP) 
            </button> 
        </div>
        
        <p id="statusMessage" class="mt-2 text-sm text-gray-600 text-center min-h-[1.5rem]"></p>
        
        <div class="mb-6"> 
            <h2 class="text-lg font-semibold mb-3 text-gray-700">Ảnh gốc:</h2> 
            <div id="originalImages" class="image-grid"> <p class="text-gray-500 text-sm col-span-full">Chưa có ảnh nào được chọn.</p> </div> 
        </div>
        
        <div> 
            <h2 class="text-lg font-semibold mb-3 text-gray-700">Ảnh đã chuyển đổi:</h2> 
            <div id="convertedImages" class="image-grid"> <p class="text-gray-500 text-sm col-span-full">Ảnh đã chuyển đổi sẽ xuất hiện ở đây.</p> </div> 
        </div>
    </div>

    <!-- Modal xem ảnh chi tiết -->
    <div id="imageModal" class="image-modal"> 
        <div class="modal-content"> 
            <button id="modalCloseBtn" class="modal-close-btn" aria-label="Đóng">&times;</button> 
            <div id="modalImageContainer" class="modal-image-container"> <img id="modalImage" src="" alt="Ảnh chi tiết" class="modal-image"> </div> 
            <div class="modal-controls"> 
                <button id="zoomOutBtn" class="zoom-btn" aria-label="Thu nhỏ">-</button> 
                <button id="zoomInBtn" class="zoom-btn" aria-label="Phóng to">+</button> 
            </div> 
        </div> 
    </div>

    <script>
        // Chạy khi trang đã tải xong hoàn toàn
        window.addEventListener('DOMContentLoaded', () => {
            console.log("--- Script v2.1 starting ---");

            try {
                if (typeof JSZip === 'undefined') {
                    console.error("JSZip library is not loaded!");
                    // Không chặn ứng dụng, chỉ cảnh báo tính năng ZIP
                }
                
                // Helper để lấy element an toàn, tránh lỗi null
                const getEl = (id) => {
                    const el = document.getElementById(id);
                    if (!el) throw new Error(`Không tìm thấy phần tử giao diện: ${id}`);
                    return el;
                };

                // DOM Elements
                const fileInput = getEl('fileInput');
                const dropZone = getEl('dropZone');
                const qualitySlider = getEl('qualitySlider');
                const qualityValueSpan = getEl('qualityValue');
                const outputFormatSelect = getEl('outputFormat');
                const convertButton = getEl('convertButton');
                const downloadZipButton = getEl('downloadZipButton');
                const originalImagesDiv = getEl('originalImages');
                const convertedImagesDiv = getEl('convertedImages');
                const statusMessage = getEl('statusMessage');
                
                // Modal Elements
                const imageModal = getEl('imageModal');
                const modalImageContainer = getEl('modalImageContainer');
                const modalImage = getEl('modalImage');
                const modalCloseBtn = getEl('modalCloseBtn');
                const zoomInBtn = getEl('zoomInBtn');
                const zoomOutBtn = getEl('zoomOutBtn');
                const modalContent = imageModal.querySelector('.modal-content'); // QuerySelector class

                // State
                let selectedFiles = [];
                let convertedWebpData = [];
                let individualBlobUrls = [];
                let currentZoom = 1;
                const maxZoom = 5, minZoom = 0.5, zoomStep = 0.2;
                let isDragging = false, startX, startY, scrollLeftStart, scrollTopStart;

                // --- Helper: Format Bytes ---
                function formatBytes(bytes, decimals = 2) {
                    if (!+bytes) return '0 Bytes';
                    const k = 1024;
                    const dm = decimals < 0 ? 0 : decimals;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
                }

                // --- Helper: Functions (Hoisted) ---
                function dataURLtoBlob(dataUrl) { 
                    try { 
                        const arr = dataUrl.split(','); if (arr.length < 2) return null; 
                        const mime = arr[0].match(/:(.*?);/)[1]; 
                        const bstr = atob(arr[1]); 
                        let n = bstr.length; 
                        const u8arr = new Uint8Array(n); 
                        while (n--) { u8arr[n] = bstr.charCodeAt(n); } 
                        return new Blob([u8arr], { type: mime }); 
                    } catch (e) { return null; } 
                }
                
                function revokeIndividualBlobUrls() { 
                    individualBlobUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e) {} }); 
                    individualBlobUrls = []; 
                }

                function createErrorItem(message, container) { 
                    const div = document.createElement('div'); 
                    div.className = 'image-item bg-red-50 border-red-200 p-2 flex items-center justify-center text-center'; 
                    const p = document.createElement('p'); 
                    p.className = 'error-message text-red-600 text-xs'; 
                    p.textContent = message; 
                    div.appendChild(p); 
                    if (container) container.appendChild(div); 
                    return div; 
                }

                function createImageItem(src, name, type, addDownloadLink = false, convertedItemRef = null, size = 0, originalSize = 0) {
                    const div = document.createElement('div'); div.className = 'image-item';
                    
                    const img = document.createElement('img'); 
                    img.src = src;
                    const displayName = name.replace(/\.priority$/i, ''); // Clean name
                    img.alt = `${type}: ${displayName}`;
                    img.loading = 'lazy';
                    
                    const infoDiv = document.createElement('div'); infoDiv.className = 'info';
                    
                    const p = document.createElement('p'); 
                    p.className = 'text-xs text-gray-800 font-medium truncate px-1'; 
                    p.textContent = displayName; p.title = displayName;
                    infoDiv.appendChild(p);

                    // Size Display Logic
                    if (size > 0) {
                        const sizeP = document.createElement('p');
                        sizeP.className = 'file-size';
                        
                        if (originalSize > 0 && size !== originalSize) {
                            const diff = size - originalSize;
                            const percent = Math.round((diff / originalSize) * 100);
                            const colorClass = diff < 0 ? 'text-green-600' : 'text-red-600';
                            const sign = diff < 0 ? '' : '+';
                            sizeP.innerHTML = `${formatBytes(size)} <span class="size-diff ${colorClass}">(${sign}${percent}%)</span>`;
                        } else {
                            sizeP.textContent = formatBytes(size);
                        }
                        infoDiv.appendChild(sizeP);
                    }

                    if (addDownloadLink && convertedItemRef) {
                        const downloadLink = document.createElement('a'); 
                        downloadLink.textContent = 'Tải về'; 
                        downloadLink.className = 'inline-block bg-green-500 hover:bg-green-600 text-white text-xs font-medium py-1 px-2 rounded transition duration-150 ease-in-out no-underline';
                        downloadLink.download = convertedItemRef.name;
                        
                        try {
                            const blob = dataURLtoBlob(src);
                            if (blob) { 
                                const blobUrl = URL.createObjectURL(blob); 
                                downloadLink.href = blobUrl; 
                                convertedItemRef.blobUrl = blobUrl; 
                                individualBlobUrls.push(blobUrl); 
                            } else { throw new Error('Blob Error'); }
                        } catch (error) {
                            downloadLink.textContent = 'Lỗi'; downloadLink.style.pointerEvents = 'none'; downloadLink.style.backgroundColor = '#f87171';
                        } 
                        infoDiv.appendChild(downloadLink);
                    }
                    
                    div.appendChild(img); 
                    div.appendChild(infoDiv);
                    return div;
                }

                // --- Modal Logic ---
                function updateZoomButtons() { 
                    if (zoomInBtn) zoomInBtn.disabled = currentZoom >= maxZoom; 
                    if (zoomOutBtn) zoomOutBtn.disabled = currentZoom <= minZoom; 
                }
                function applyZoom() { 
                    if (modalImage) modalImage.style.transform = `scale(${currentZoom})`; 
                    updateZoomButtons(); 
                }
                function handleWheelZoom(event) {
                    event.preventDefault(); const delta = event.deltaY || event.detail || event.wheelDelta;
                    if (delta < 0) { currentZoom = Math.min(maxZoom, currentZoom + zoomStep); }
                    else { currentZoom = Math.max(minZoom, currentZoom - zoomStep); }
                    applyZoom();
                }
                function openImageModal(imageSrc) {
                    if (!imageModal || !modalImage) return;
                    modalImage.src = imageSrc; currentZoom = 1; modalImage.style.transform = `scale(${currentZoom})`;
                    if (modalImageContainer) { modalImageContainer.scrollTop = 0; modalImageContainer.scrollLeft = 0; }
                    updateZoomButtons();
                    imageModal.classList.add('active');
                    document.addEventListener('keydown', handleEscapeKey);
                    if (modalImageContainer) modalImageContainer.addEventListener('wheel', handleWheelZoom, { passive: false });
                }
                function closeImageModal() {
                    if (!imageModal) return;
                    imageModal.classList.remove('active'); 
                    if (modalImage) modalImage.src = "";
                    document.removeEventListener('keydown', handleEscapeKey);
                    if (modalImageContainer) modalImageContainer.removeEventListener('wheel', handleWheelZoom);
                }
                function handleEscapeKey(event) { if (event.key === 'Escape') closeImageModal(); }
                
                // --- Main Logic ---

                // File Handling
                function handleFiles(files) {
                    const newFiles = Array.from(files);
                    let validFiles = [], invalidFiles = [];
                    
                    revokeIndividualBlobUrls();
                    originalImagesDiv.innerHTML = '';
                    convertedImagesDiv.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Ảnh đã chuyển đổi sẽ xuất hiện ở đây.</p>';
                    statusMessage.textContent = '';
                    convertedWebpData = [];
                    downloadZipButton.disabled = true;

                    newFiles.forEach((file) => {
                        if (file.type.match(/image\/(png|jpeg|jpg)/i)) {
                            validFiles.push(file);
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                originalImagesDiv.appendChild(createImageItem(e.target.result, file.name, 'Gốc', false, null, file.size));
                            };
                            reader.onerror = () => createErrorItem(`Lỗi đọc file: ${file.name}`, originalImagesDiv);
                            reader.readAsDataURL(file);
                        } else {
                            invalidFiles.push(file.name);
                            createErrorItem(`"${file.name}" không hợp lệ`, originalImagesDiv);
                        }
                    });

                    selectedFiles = validFiles;
                    convertButton.disabled = selectedFiles.length === 0;
                    
                    if (invalidFiles.length > 0) { statusMessage.textContent = `Đã bỏ qua ${invalidFiles.length} tệp không hỗ trợ.`; }
                    if (selectedFiles.length === 0 && invalidFiles.length === 0) { originalImagesDiv.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Chưa có ảnh nào được chọn.</p>'; }
                }

                // Listeners Registration
                qualitySlider.addEventListener('input', () => { qualityValueSpan.textContent = qualitySlider.value; });
                fileInput.addEventListener('change', (event) => handleFiles(event.target.files));
                dropZone.addEventListener('click', () => fileInput.click());
                
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => { 
                    dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false); 
                });
                ['dragenter', 'dragover'].forEach(eventName => { 
                    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false); 
                });
                ['dragleave', 'drop'].forEach(eventName => { 
                    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false); 
                });
                dropZone.addEventListener('drop', (event) => handleFiles(event.dataTransfer.files), false);

                // Conversion
                convertButton.addEventListener('click', async () => {
                    if (selectedFiles.length === 0) { statusMessage.textContent = 'Vui lòng chọn ảnh.'; return; }
                    
                    revokeIndividualBlobUrls();
                    convertButton.disabled = true; downloadZipButton.disabled = true; 
                    statusMessage.textContent = 'Đang xử lý...';
                    convertedImagesDiv.innerHTML = ''; convertedWebpData = [];
                    
                    const quality = parseInt(qualitySlider.value) / 100;
                    const outputMimeType = outputFormatSelect.value;
                    let successCount = 0, errorCount = 0;

                    const processFile = (file) => {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                                    const ctx = canvas.getContext('2d');
                                    if (outputMimeType === 'image/jpeg') {
                                        ctx.fillStyle = '#FFFFFF';
                                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    }
                                    ctx.drawImage(img, 0, 0);
                                    
                                    try {
                                        const newDataUrl = canvas.toDataURL(outputMimeType, quality);
                                        if (!newDataUrl || newDataUrl === 'data:,') { throw new Error('Empty data'); }

                                        let newFileName;
                                        const originalName = file.name;
                                        const isPriority = originalName.toLowerCase().includes('.priority');
                                        
                                        let newExt = '.webp';
                                        if (outputMimeType === 'image/png') newExt = '.png';
                                        if (outputMimeType === 'image/jpeg') newExt = '.jpg';

                                        const nameWithoutExt = originalName.replace(/\.(png|jpe?g)$/i, '');
                                        const nameClean = nameWithoutExt.replace(/\.priority$/i, '');
                                        newFileName = nameClean + newExt;

                                        const approxSize = Math.round((newDataUrl.length - 22) * 0.75);
                                        const convertedItem = {
                                            name: newFileName, dataUrl: newDataUrl, blobUrl: null,
                                            isPriority: isPriority, size: approxSize, originalSize: file.size
                                        };
                                        convertedWebpData.push(convertedItem);
                                        
                                        const itemElement = createImageItem(newDataUrl, newFileName, outputMimeType.split('/')[1].toUpperCase(), true, convertedItem, approxSize, file.size);
                                        convertedImagesDiv.appendChild(itemElement);
                                        resolve();
                                    } catch (error) {
                                        createErrorItem(`Lỗi: ${file.name}`, convertedImagesDiv);
                                        reject(error);
                                    }
                                };
                                img.onerror = () => reject(new Error('Img Load Error'));
                                img.src = e.target.result;
                            };
                            reader.onerror = () => reject(new Error('File Read Error'));
                            reader.readAsDataURL(file);
                        });
                    };

                    try {
                        const results = await Promise.allSettled(selectedFiles.map(file => processFile(file)));
                        successCount = results.filter(r => r.status === 'fulfilled').length;
                        errorCount = results.filter(r => r.status === 'rejected').length;
                    } catch (error) { console.error(error); }
                    finally {
                        statusMessage.textContent = `Hoàn tất: ${successCount} thành công, ${errorCount} lỗi.`; 
                        convertButton.disabled = false; 
                        downloadZipButton.disabled = successCount === 0 || typeof JSZip === 'undefined';
                    }
                });

                // ZIP Download
                downloadZipButton.addEventListener('click', async () => {
                    if (convertedWebpData.length === 0 || typeof JSZip === 'undefined') return;
                    const validData = convertedWebpData.filter(item => item.dataUrl && item.dataUrl !== 'data:,');
                    if (validData.length === 0) return;
                    
                    statusMessage.textContent = 'Đang tạo ZIP...'; downloadZipButton.disabled = true;
                    let link = null;

                    try {
                        const zip = new JSZip();
                        validData.forEach(item => {
                            const base64Data = item.dataUrl.split(',')[1];
                            if (base64Data) {
                                const folder = item.isPriority ? 'priority/' : 'base/';
                                zip.file(folder + item.name, base64Data, { base64: true });
                            }
                        });
                        const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
                        link = document.createElement('a'); 
                        link.href = URL.createObjectURL(zipBlob); 
                        link.download = 'converted_images.zip';
                        document.body.appendChild(link); link.click();
                        statusMessage.textContent = 'ZIP đã tải xuống.';
                    } catch (error) {
                        statusMessage.textContent = `Lỗi ZIP: ${error.message}`;
                    } finally {
                        downloadZipButton.disabled = validData.length === 0;
                        if (link) { setTimeout(() => { if (link.parentNode) link.parentNode.removeChild(link); try { URL.revokeObjectURL(link.href); } catch (e) {} }, 1000); }
                    }
                });

                // Image Click Delegation
                const handleImageClick = (event, dataArray) => {
                    if (event.target.classList.contains('image-item') && !event.target.querySelector('a')?.contains(event.target)) { 
                        const imgElement = event.target.querySelector('img'); 
                        if (imgElement) openImageModal(imgElement.src); 
                    }
                };
                originalImagesDiv.addEventListener('click', (e) => handleImageClick(e, null));
                convertedImagesDiv.addEventListener('click', (e) => handleImageClick(e, convertedWebpData));
                
                modalCloseBtn.addEventListener('click', closeImageModal);
                imageModal.addEventListener('click', (event) => { if (event.target === imageModal) closeImageModal(); });
                zoomInBtn.addEventListener('click', () => { if (currentZoom < maxZoom) { currentZoom = Math.min(maxZoom, currentZoom + zoomStep); applyZoom(); } });
                zoomOutBtn.addEventListener('click', () => { if (currentZoom > minZoom) { currentZoom = Math.max(minZoom, currentZoom - zoomStep); applyZoom(); } });

                // Panning Logic
                modalImage.addEventListener('mousedown', (e) => { if (currentZoom > 1) { e.preventDefault(); isDragging = true; startX = e.pageX - modalImageContainer.offsetLeft; startY = e.pageY - modalImageContainer.offsetTop; scrollLeftStart = modalImageContainer.scrollLeft; scrollTopStart = modalImageContainer.scrollTop; modalImage.classList.add('grabbing'); } });
                modalImage.addEventListener('mousemove', (e) => { if (!isDragging || currentZoom <= 1) return; e.preventDefault(); const x = e.pageX - modalImageContainer.offsetLeft; const y = e.pageY - modalImageContainer.offsetTop; const walkX = (x - startX); const walkY = (y - startY); modalImageContainer.scrollLeft = scrollLeftStart - walkX; modalImageContainer.scrollTop = scrollTopStart - walkY; });
                modalImage.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; modalImage.classList.remove('grabbing'); } });
                modalImage.addEventListener('mouseleave', () => { if (isDragging) { isDragging = false; modalImage.classList.remove('grabbing'); } });
                if (modalContent) modalContent.addEventListener('mouseleave', () => { if (isDragging) { isDragging = false; modalImage.classList.remove('grabbing'); } });

            } catch (initError) {
                console.error("Critical Init Error:", initError);
                // Hiển thị lỗi trực tiếp lên UI để người dùng thấy
                const statusMessage = document.getElementById('statusMessage');
                if (statusMessage) {
                    statusMessage.innerHTML = `<span style="color:red; font-weight:bold;">Lỗi khởi tạo ứng dụng: ${initError.message}</span>`;
                } else {
                    alert(`Lỗi khởi tạo nghiêm trọng: ${initError.message}`);
                }
            }
        });
    </script>
